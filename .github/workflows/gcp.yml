name: GCP Test Pipeline

on:
  push:   # run manually from GitHub Actions tab
    branches: 
      - staging
jobs:
  test-gcp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify authentication
        run: gcloud auth list

      - name: SSH to test instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_IP }}       # public IP of your EC2
          username: ubuntu                  # or ec2-user depending on the AMI
          key: ${{ secrets.SSH_KEY }}       # private key
          script: |
            echo "check the running containers"
            docker ps
